<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff7eb6">
<title>Minik Oyun Dünyam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;color:#5b3a6b;
background:linear-gradient(160deg,#ffe3f1 0%,#efe2ff 55%,#dff3ff 100%)}
button{font-family:inherit;color:inherit;border:none;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
header{height:64px;flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px}
.hbtn{width:52px;height:52px;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 4px 0 #e7c6e0;display:flex;align-items:center;justify-content:center}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e7c6e0}
#title{flex:1;font-size:clamp(18px,5.5vw,26px);font-weight:800;text-align:center;color:#c2418a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stars{background:#fff;border-radius:30px;padding:4px 14px;font-size:24px;font-weight:800;box-shadow:0 4px 0 #f2d78a;color:#d08a00}
#stars.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.35)}}
.screen{flex:1;min-height:0;display:none}
.screen.active{display:flex}
/* HOME */
#home{flex-direction:column;align-items:center;justify-content:center;padding:10px 16px 20px;gap:12px}
#home h1{margin:0;font-size:clamp(30px,7vw,52px);color:#d6337a;text-shadow:0 3px 0 #fff;line-height:1.05;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(560px,100%)}
@media (min-aspect-ratio:4/3){.tiles{grid-template-columns:repeat(3,1fr);width:min(760px,100%)}}
.tile{border-radius:28px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.12);font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.tile span{font-size:clamp(46px,11vw,64px);line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.t1{background:#ff7eb6}.t2{background:#b28dff}.t3{background:#ff9f5a}.t4{background:#4fc3a1}.t5{background:#5bb8f5}.t6{background:#f5b82e}
/* GAME LAYOUT */
.game{flex-direction:column}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px}
.stage>svg{height:100%;width:100%;max-height:100%;overflow:visible}
.panel{flex:none;background:#fff;border-radius:30px 30px 0 0;padding:10px 12px 14px;box-shadow:0 -4px 16px rgba(160,90,160,.15);max-height:46%;display:flex;flex-direction:column;gap:8px}
@media (orientation:landscape) and (min-width:640px){
 .game{flex-direction:row}
 .panel{width:44%;max-height:none;border-radius:30px 0 0 30px}
 .opts{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
}
.tabs{display:flex;gap:8px;overflow-x:auto;flex:none;padding-bottom:2px}
.tab{flex:none;min-width:62px;height:62px;border-radius:20px;background:#f6ecff;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tab small{font-size:12px;font-weight:700;margin-top:3px}
.tab.on{background:#ff7eb6;color:#fff;box-shadow:0 4px 0 #d6337a}
.opts{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;padding:4px;align-content:start}
.opt{aspect-ratio:1;border-radius:50%;background:#f8f2ff;display:flex;align-items:center;justify-content:center;font-size:34px;border:4px solid transparent;overflow:hidden;padding:0}
.opt.sq{border-radius:20px}
.opt svg{width:100%;height:100%}
.opt.on{border-color:#ff4f9a;box-shadow:0 0 0 3px #ffd1e6}
.opt:active{transform:scale(.92)}
.acts{display:flex;gap:8px;flex:none}
.act{flex:1;height:56px;border-radius:20px;font-size:20px;font-weight:800;background:#f1e6ff;display:flex;align-items:center;justify-content:center;gap:6px}
.act.go{background:#4fc3a1;color:#fff;box-shadow:0 4px 0 #2f9d7e}
.act.pink{background:#ff7eb6;color:#fff;box-shadow:0 4px 0 #d6337a}
.act:active{transform:translateY(3px);box-shadow:none}
.say{font-size:21px;font-weight:700;text-align:center;line-height:1.2;flex:none;color:#7a4a8c}
.big{font-size:40px;height:76px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.food{width:76px;height:76px;border-radius:24px;background:#fff5e6;font-size:40px;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;box-shadow:0 4px 0 #f0d9b5}
.food small{font-size:13px;font-weight:700;margin-top:2px}
.food.on{background:#ffe08a}
.food:active{transform:translateY(3px);box-shadow:none}
/* MENU (recipes / puzzles) */
.menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.menu h2{margin:0;font-size:30px;color:#c2418a;text-align:center}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{width:150px;padding:14px 8px;border-radius:28px;background:#fff;box-shadow:0 6px 0 #e7c6e0;display:flex;flex-direction:column;align-items:center;font-size:22px;font-weight:800}
.card span{font-size:64px;line-height:1.1}
.card img{width:120px;height:120px;border-radius:16px}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #e7c6e0}
/* effects */
.spark{position:absolute;font-size:30px;pointer-events:none;animation:spark 1s forwards}
@keyframes spark{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.3) rotate(90deg);opacity:1}100%{transform:scale(.6) translateY(-40px) rotate(180deg);opacity:0}}
.conf{position:fixed;top:-30px;width:12px;height:18px;border-radius:3px;pointer-events:none;z-index:99;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);background:#fff;padding:18px 28px;border-radius:30px;font-size:34px;font-weight:800;color:#d6337a;box-shadow:0 8px 0 #f2b6d4;z-index:100;animation:toast 2s forwards;text-align:center;pointer-events:none}
@keyframes toast{15%{transform:translate(-50%,-50%) scale(1.1)}25%,80%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.grow{transform-origin:160px 160px;animation:grow .5s}
@keyframes grow{from{transform:scale(.2);opacity:0}}
.flick{animation:flick .3s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.15) scaleX(.9)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.oven{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,240,250,.85);font-size:30px;font-weight:800;color:#c2418a}
.oven svg{width:min(70%,300px);height:auto}
.oven b{font-size:70px}
/* MARKET */
#market{flex-direction:column}
.mk{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:6px 12px 12px;overflow-y:auto}
.list{background:#fffbe8;border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 #f0dea0;flex:none;flex-wrap:wrap;justify-content:center}
.list b{font-size:20px}
.li{font-size:40px;position:relative;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px}
.li.ok::after{content:'✔';position:absolute;right:-6px;bottom:-6px;font-size:22px;background:#4fc3a1;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;background:#f3d7b0;border-radius:22px;padding:12px;box-shadow:inset 0 -8px 0 #ddb787;flex:none}
.item{background:#fff;border-radius:18px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-size:44px;line-height:1.1;box-shadow:0 4px 0 #e0c39b}
.item.gone{visibility:hidden}
.price{display:flex;gap:2px;margin-top:2px}
.coin{display:inline-flex;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#f5b82e 60%,#d08a00);box-shadow:0 1px 0 #a86d00;flex:none}
.coin.b{width:44px;height:44px;font-size:20px;font-weight:800;align-items:center;justify-content:center;color:#8a5a00}
.basket{background:#fff;border-radius:22px;padding:8px 12px;min-height:70px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;box-shadow:0 4px 0 #e7c6e0;flex:none}
.basket .bi{font-size:40px;animation:grow .4s}
.wallet,.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px;padding:10px;border-radius:22px}
.wallet{background:#e6f4ff}.tray{background:#fff2c6;border:3px dashed #f5b82e}
.wallet .coin,.tray .coin{cursor:pointer}
/* PUZZLE */
#puzzle{flex-direction:column}
.pz{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px;padding:6px 10px 12px}
@media (orientation:landscape) and (min-width:640px){.pz{flex-direction:row}}
.board{position:relative;display:grid;border-radius:14px;background:#fff;box-shadow:0 6px 0 #e7c6e0;flex:none}
.board .ghost{position:absolute;inset:0;border-radius:14px;background-size:100% 100%;opacity:.22}
.slot{border:2px dashed rgba(180,120,200,.5);position:relative}
.piece{background-repeat:no-repeat;border-radius:8px;box-shadow:0 3px 6px rgba(0,0,0,.25);touch-action:none}
.tray2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;max-width:520px}
.drag{position:fixed;z-index:50;pointer-events:none;transform:scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="app">
 <header>
  <button class="hbtn" id="homeBtn" aria-label="Ana sayfa" style="visibility:hidden">🏠</button>
  <div id="title">Minik Oyun Dünyam</div>
  <div id="stars">⭐ 0</div>
  <button class="hbtn" id="sndBtn" aria-label="Ses">🔊</button>
 </header>

 <section class="screen active" id="home">
  <h1>Ne oynamak istersin?</h1>
  <div class="tiles">
   <button class="tile t1" data-go="makeup"><span>💄</span>Makyaj</button>
   <button class="tile t2" data-go="dress"><span>👗</span>Giydir</button>
   <button class="tile t3" data-go="hair"><span>💇‍♀️</span>Kuaför</button>
   <button class="tile t4" data-go="kitchen"><span>🧁</span>Mutfak</button>
   <button class="tile t5" data-go="market"><span>🛒</span>Market</button>
   <button class="tile t6" data-go="puzzle"><span>🧩</span>Yapboz</button>
  </div>
 </section>

 <section class="screen game" id="doll">
  <div class="stage" id="dollStage"></div>
  <div class="panel">
   <div class="tabs" id="dollTabs"></div>
   <div class="opts" id="dollOpts"></div>
   <div class="acts" id="dollActs"></div>
  </div>
 </section>

 <section class="screen game" id="kitchen">
  <div class="stage" id="kStage"></div>
  <div class="panel" id="kPanel"></div>
 </section>

 <section class="screen" id="market"><div class="mk" id="mk"></div></section>

 <section class="screen" id="puzzle"><div class="pz" id="pz"></div></section>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function h(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='on')e.addEventListener('click',v);else if(k==='html')e.innerHTML=v;else if(k==='cls')e.className=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v)}kids.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});return e}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function hx(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function toHex(r){return'#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
const shade=(c,a)=>toHex(hx(c).map(v=>v*(1+a)));
const lighten=(c,a)=>toHex(hx(c).map(v=>v+(255-v)*a));
function starPath(cx,cy,R,r){let d='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)}return d+'Z'}
const heartPath=(x,y,s)=>`M${x} ${y+s*.3} C${x} ${y-s*.2} ${x-s} ${y-s*.2} ${x-s} ${y+s*.25} C${x-s} ${y+s*.6} ${x} ${y+s} ${x} ${y+s} C${x} ${y+s} ${x+s} ${y+s*.6} ${x+s} ${y+s*.25} C${x+s} ${y-s*.2} ${x} ${y-s*.2} ${x} ${y+s*.3}Z`;
function svgPoint(svg,ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}

/* ---------- data ---------- */
const SKIN=['#FFE0CC','#F5C6A5','#D9A07A','#A86F4C'];
const EYE=['#5a3b2e','#3d7bd9','#3aa35c','#8a5a2b','#7a4fc8'];
const LIP=[null,'#FF5C8A','#E8283C','#FF8566','#B4479C','#FF9EC4'];
const SHADOW=[null,'#7EC8FF','#B98CFF','#7EDC9C','#FFD45C','#FF9EDB'];
const BLUSH=[null,'#FF7FA8','#FF9F80','#E58CFF'];
const STICK=[null,'❤️','⭐','🦋','🌸','🌈'];
const HAIRS=['uzun','kisa','atkuyrugu','orgu','kivircik','topuz'];
const HAIRC=['#6B4226','#F2C94C','#2B2B2B','#C8512E','#FF8FC8','#A97CFF','#5BC0F8'];
const HACC=[null,'fiyonk','cicek','tac','bant'];
const DRESSES=['prenses','elbise','etek','tulum'];
const COLORS=['#FF7EB6','#B28DFF','#6EC6FF','#7EE0A8','#FFD166','#FF6B6B','#FFFFFF'];
const PATS=['duz','nokta','yildiz','kalp','cizgi'];
const SHOES=['babet','bot','spor','prenses'];
const ACCS=[['kolye','📿'],['canta','👜'],['gozluk','👓'],['asa','🪄']];
const NUM=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz','on'];
const PRAISE=['Harika oldu!','Çok güzel!','Muhteşem!','Bayıldım!','Süpersin!'];
function defDoll(){return{skin:SKIN[0],eye:EYE[0],lip:null,shadow:null,blush:null,stick:null,hair:'uzun',hairColor:HAIRC[0],hairAcc:null,dress:'prenses',dressColor:'#FF7EB6',pattern:'duz',shoes:'babet',shoeColor:'#FF7EB6',acc:[]}}

/* ---------- storage ---------- */
let S={doll:defDoll(),stars:0,sound:true};
try{const d=JSON.parse(localStorage.getItem('minik-dunya')||'null');if(d){S={...S,...d,doll:{...defDoll(),...(d.doll||{})}}}}catch(e){}
function save(){try{localStorage.setItem('minik-dunya',JSON.stringify(S))}catch(e){}}

/* ---------- sound & voice ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',vol=.15,delay=0){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
const pop=()=>{tone(660,.08,'triangle');tone(990,.09,'triangle',.1,.05)};
const yay=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.1));
const oops=()=>{tone(320,.14,'sine',.15);tone(230,.2,'sine',.15,.12)};
const munch=()=>{tone(180,.06,'square',.06);tone(140,.06,'square',.06,.08)};
const blow=()=>{if(!S.sound)return;const a=ac();if(!a)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;const g=a.createGain();g.gain.value=.25;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=900;n.connect(f).connect(g).connect(a.destination);n.start()};
function bdaySong(){const G=392,A=440,B=494,C=523,D=587,E=659,F=698;const m=[[G,.5],[G,.5],[A,1],[G,1],[C,1],[B,2],[G,.5],[G,.5],[A,1],[G,1],[D,1],[C,2]];let t=0;m.forEach(([f,d])=>{tone(f,d*.28,'triangle',.14,t);t+=d*.3})}
let trVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();trVoice=v.find(x=>(x.lang||'').toLowerCase().startsWith('tr'))||null}catch(e){}}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!S.sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';if(trVoice)u.voice=trVoice;u.rate=.95;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('pointerdown',()=>ac(),{passive:true});

/* ---------- effects ---------- */
function confetti(){const cols=['#ff7eb6','#b28dff','#5bb8f5','#4fc3a1','#f5b82e','#ff9f5a'];for(let i=0;i<46;i++){const c=h('div',{cls:'conf',style:`left:${Math.random()*100}vw;background:${rnd(cols)};animation-delay:${Math.random()*.6}s;animation-duration:${1.8+Math.random()}s`});document.body.append(c);setTimeout(()=>c.remove(),3200)}}
function toast(t){const e=h('div',{cls:'toast'},t);document.body.append(e);setTimeout(()=>e.remove(),2100)}
function sparkle(stage,n=4){const r=stage.getBoundingClientRect();for(let i=0;i<n;i++){const s=h('div',{cls:'spark',style:`left:${20+Math.random()*(r.width-60)}px;top:${20+Math.random()*(r.height-80)}px;animation-delay:${i*.08}s`},rnd(['✨','⭐','💖','🌟']));stage.append(s);setTimeout(()=>s.remove(),1300)}}
function updStars(b){const e=$('#stars');e.textContent='⭐ '+S.stars;if(b){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}
function win(msg){S.stars++;save();updStars(true);yay();confetti();msg=msg||rnd(PRAISE);toast(msg);say(msg)}

/* ---------- navigation ---------- */
const TITLES={home:'Minik Oyun Dünyam',makeup:'Makyaj Salonu',hair:'Kuaför',dress:'Giydirme Odası',kitchen:'Mutfak',market:'Market',puzzle:'Yapboz'};
function go(id){
 pop();
 const scr=(id==='makeup'||id==='hair'||id==='dress')?'doll':id;
 document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===scr));
 $('#title').textContent=TITLES[id];
 $('#homeBtn').style.visibility=id==='home'?'hidden':'visible';
 if(scr==='doll')openDoll(id);
 if(id==='kitchen')kitchenMenu();
 if(id==='market')marketStart();
 if(id==='puzzle')puzzleMenu();
 if(id==='home')say('Ne oynamak istersin?');
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
$('#homeBtn').onclick=()=>go('home');
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();$('#sndBtn').textContent=S.sound?'🔊':'🔇';if(!S.sound)try{speechSynthesis.cancel()}catch(e){}else pop()};
$('#sndBtn').textContent=S.sound?'🔊':'🔇';
updStars();

/* =========================================================
   DOLL DRAWING
   ========================================================= */
let UID=0;
function patDef(p,u,col){const W=`fill="${col}" opacity=".55"`;
 if(p==='nokta')return`<pattern id="pt${u}" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.5" ${W}/><circle cx="16" cy="16" r="3.5" ${W}/></pattern>`;
 if(p==='yildiz')return`<pattern id="pt${u}" width="26" height="26" patternUnits="userSpaceOnUse"><path d="${starPath(13,13,7,3)}" ${W}/></pattern>`;
 if(p==='kalp')return`<pattern id="pt${u}" width="24" height="24" patternUnits="userSpaceOnUse"><path d="${heartPath(12,6,6)}" ${W}/></pattern>`;
