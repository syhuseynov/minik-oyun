name: Glow Studyo APK
on:
  push:
    paths:
      - 'glow/**'
      - '.github/workflows/glow.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: |
          npx cap add android
          npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../GlowStudyo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: glow-v1.${{ github.run_number }}
          name: Glow Stüdyo ${{ github.run_number }}
          make_latest: false
          files: glow/GlowStudyo.apk
